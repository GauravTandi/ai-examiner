<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai-examiner</title>
</head>
<body>
    <h1>Exam Test Question</h1>
    <hr>
    <p>what is the color of orange ?</p>
    <input type="text" id="answer" placeholder="Type your answer">
    <button id="btnBox"> submit </button>
    <hr>
    <div id="result">Result here</div> 
    <div id="checkCW">answer: (correct / wrong) </div>

    <script>
        const button = document.getElementById("btnBox");
        const answer = document.getElementById("answer");

        button.addEventListener("click", function() {
            document.getElementById("result").innerText = answer.value.toLowerCase();
            if (answer.value.toLowerCase() == "orange") {
                document.getElementById("checkCW").innerText = "answer: correct"
            } else {
                document.getElementById("checkCW").innerText = "answer: wrong"
            };
        });

    </script>
</body>
</html>
